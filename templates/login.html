<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>login</title>
    </head>
    <body>
        <div class="body">
            <form
                class="login modal-content animate"
                action="{{ url_for('login') }}"
                method="post"
            >
                <label for="username"><b>Username</b></label>
                <input
                    type="text"
                    placeholder="Enter Username"
                    name="username"
                    id="username"
                    required
                /><b></b>

                <label class="pass" for="password"><b>Password</b></label>
                <input
                    type="password"
                    placeholder="Enter Password"
                    name="password"
                    id="password"
                    required
                /><b></b>


                <button id="Remember" label="submit"><b>Login</b></button>
                <label>
                    <input type="checkbox" checked="checked" name="remember" />
                    Remember me
                </label>
                <button
                    style="background-color: #ff4d4d; margin-top: 10px; width: 70px"
                    type="button"
                    onclick="window.location.href='/'"
                >
                    Cancel
                </button>
                <div
                    id="errors"
                    style="color: red; margin-top: 10px; display: none"
                ></div>
            </form>
            <style>
                .body {
                    height: 100%;
                    width: 100%;
                    border-radius: 50px; /* même bordure que le form */
                    animation: change 8s infinite alternate;
                    /*background-size: cover;*/
                    background-position: center;
                }
                .login {
                    height: 400px;
                    width: 90%;
                    max-width: 400px;
                    margin: 50px auto;
                    padding: 40px;
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    border-radius: 50px;
                    border: 1px solid #ccc;
                    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
                    background-color: white;
                }

                @keyframes change {
                    0% {
                        background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTQ1rfyL35ggTRZ29zGvTR4ihwKloOUDuRmRg&s');
                    }
                    50% {
                        background-image: url('https://media.licdn.com/dms/image/v2/D4E22AQF915Kz1_uVyw/feedshare-shrink_800/B4EZTL1XTDHUAk-/0/1738586552386?e=2147483647&v=beta&t=n4y3v7RuV5shIUcXmXbohVj2QbDwcmnrbsnaCnc6fbQ');
                    }
                    100% {
                        background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTQ1rfyL35ggTRZ29zGvTR4ihwKloOUDuRmRg&s');
                    }
                }
                #remember {
                    width: 70px;
                    background-color: #04aa6d;
                }

                .animate {
                    -webkit-animation: animatezoom 0.6s;
                    animation: animatezoom 0.6s;
                }
                #errors {
                    color: #ff4d4d;
                    font-weight: bold;
                    font-size: 14px;
                    margin-top: 5px;
                }

                @-webkit-keyframes animatezoom {
                    from {
                        -webkit-transform: scale(0);
                    }
                    to {
                        -webkit-transform: scale(1);
                    }
                }

                @keyframes animatezoom {
                    from {
                        transform: scale(0);
                        opacity: 0;
                    }
                    to {
                        transform: scale(1);
                        opacity: 1;
                    }
                }
                /* Inputs */
                input {
                    padding: 10px; /* espace à l'intérieur */
                    border: 1px solid #ccc;
                    border-radius: 5px; /* coins arrondis */
                }

                /* Quand on clique dans l'input */
                input:focus {
                    border-color: #04aa6d; /* bordure verte */
                    outline: none; /* retire le contour par défaut du navigateur */
                }

                /* Bouton */
                button {
                    background-color: #04aa6d;
                    color: white;
                    border-radius: 5px;
                }

                /* Effet au survol du bouton */
                button:hover {
                    background-color: #039f60;
                }
            </style>
            <script>
                const form = document.querySelector('.login');
                const errDiv = document.getElementById('errors');
                const name = document.getElementById('username');
                const password = document.getElementById('password');

                form.addEventListener('submit', (e) => {
                    let errors = [];
                    errDiv.style.display = 'none';
                    errDiv.innerHTML = '';

                    if (name.value.trim() === '') {
                        errors.push('Fill out username');
                    }
                    if (password.value.trim() === '') {
                        errors.push('Fill out password');
                    }
                    if (errors.length > 0) {
                        e.preventDefault();
                        errDiv.innerHTML = errors.map((err) => '• ' + err).join('<br>');
                        errDiv.style.display = 'block';
                    }
                });
            </script>
        </div>
    </body>
</html>
{% with messages = get_flashed_messages() %}
    {% if messages %}
        <ul class="flash-messages">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
{% endwith %}
